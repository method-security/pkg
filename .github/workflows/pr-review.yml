name: 🔍 PR Review

on:
  pull_request:
    paths:
      - "**.*"
  push:
    branches:
      - develop

permissions:
  contents: read
  id-token: write
  packages: write
  security-events: write
  actions: read

jobs:
  ratchet:
    name: 🔩 Ratchet Lint
    uses: ./.github/workflows/ratchet.yml
    secrets: inherit

  codeql:
    name: 🚨 CodeQL Analysis
    uses: ./.github/workflows/codeql.yml
    secrets: inherit

  release-test:
    name: 🔨 Release Test
    uses: ./.github/workflows/release-test.yml
    secrets: inherit

  verify:
    name: 🙏🏻 Verify
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  check:
    name: ✅ Check
    if: always()
    needs:
      - codeql
      - release-test
      - verify
      - ratchet

    runs-on: ubuntu-latest

    steps:
      - name: Require all jobs to succeed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # ratchet:re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
