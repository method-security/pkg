name: 🔨 Release Test

on:
  workflow_call:
  pull_request:
    paths:
      - "**/*"
  push:
    branches:
      - develop
jobs:
  release-test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: "Check out code"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # ratchet:actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: release test
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # ratchet:goreleaser/goreleaser-action@v7
        with:
          args: "release --clean --snapshot -f .goreleaser.yaml"
          version: v2.9.0
