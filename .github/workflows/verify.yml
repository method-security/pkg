name: 🙏🏻 Verify

on:
  workflow_call:

env:
  GO_VERSION: "1.26"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Godel Verify
        run: ./godelw verify
