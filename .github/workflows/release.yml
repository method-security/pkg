name: 🎉 Release Binary

on:
  push:
    tags:
      - v*

permissions:
  id-token: write # For cosign
  packages: write # For GHCR
  contents: write # To upload archives as release assets

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # ratchet:actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # ratchet:goreleaser/goreleaser-action@v7
        with:
          version: v2.9.0
          args: release -f .goreleaser.yaml --clean
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
